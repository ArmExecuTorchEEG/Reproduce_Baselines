<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CorteX ARM — hardware-free preview</title>
<link rel="icon" href="data:,">
<style>
/* Launcher for the hardware-free preview: the real GUI runs in the frame as ?stream=1&sim=1 (simulated board and
 * synthetic dataset behind the unchanged bridge, controller, summary and styling). Nothing here is loaded by index.html. */
html,body{margin:0;height:100%;background:#060910;color:#f2f5fc;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12px}
body{display:flex;flex-direction:column}
.preview-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;background:#060a12f2;border-bottom:1px solid #a2bcff33;color:#aebfdd;flex-shrink:0}
.preview-bar b{color:#e4edff;font-weight:600}
iframe{flex:1;width:100%;border:0;min-height:0}
</style></head>
<body>
<div class="preview-bar" role="region" aria-label="Preview instructions"><b>Walkthrough:</b><span>UART &amp; replay → Connect UART</span><span>→ Play</span><span>→ Pause (summary, Run paused)</span><span>→ Resume</span><span>→ End Run (Run complete)</span><span>→ New Run</span><span>· the synthetic label is shown inside the GUI</span></div>
<iframe id="gui" src="../?stream=1&amp;sim=1" title="CorteX ARM GUI with a simulated board"></iframe>
<script>
(()=>{'use strict';const frame=document.getElementById('gui');frame.addEventListener('load',()=>{window.previewDocument=frame.contentDocument;window.previewWindow=frame.contentWindow;window.previewReady=true;});})();
</script>
</body></html>
